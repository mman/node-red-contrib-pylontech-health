<script type="text/javascript">
  RED.nodes.registerType('pylontech-health', {
    category: 'Pylontech',
    color: '#4fb3bf',
    defaults: {
      name: { value: '' },
      port: { value: '/dev/ttyPYLON', required: true },
      baud: { value: 115200, validate: RED.validators.number() },
      wakeup: { value: true },
      chain: { value: 1, validate: RED.validators.number() },
      measurementPrefix: { value: 'pylontech' },
      cellIndexBase: { value: 1 },
      includeStates: { value: true },
      readSoh: { value: false },
      readStat: { value: true },
      refreshInfoEvery: { value: 60, validate: RED.validators.number() },
      commandTimeout: { value: 3000, validate: RED.validators.number() },
      pollTimeout: { value: 30000, validate: RED.validators.number() },
    },
    inputs: 1,
    outputs: 2,
    outputLabels: ['influx points', 'health model'],
    icon: 'serial.png',
    label: function () {
      return this.name || 'pylontech health ' + (this.port || '/dev/ttyPYLON');
    },
    paletteLabel: 'pylontech health',
  });
</script>

<script type="text/html" data-help-name="pylontech-health">
  <p>
    Reads per-cell health data from a Pylontech battery stack over the master battery's
    <b>console</b> port and emits InfluxDB points.
  </p>

  <h3>Inputs</h3>
  <dl class="message-properties">
    <dt class="optional">payload <span class="property-type">any</span></dt>
    <dd>
      Any message triggers one poll: <code>pwr</code>, then <code>info N</code> and
      <code>bat N</code> for every battery present (plus <code>soh N</code> if enabled).
    </dd>
    <dt class="optional">refresh <span class="property-type">boolean</span></dt>
    <dd>
      Set to <code>true</code> to re-read <code>info N</code> (barcodes, firmware) for every battery
      on this poll.
    </dd>
    <dt class="optional">command <span class="property-type">string</span></dt>
    <dd>
      Debug passthrough. Runs a single raw console command (e.g. <code>pwr</code>,
      <code>bat 2</code>, <code>info</code>) and returns the raw text on output 2 only. Useful for
      capturing fixtures.
    </dd>
  </dl>

  <h3>Outputs</h3>
  <ol class="node-ports">
    <li>
      Influx points
      <dl class="message-properties">
        <dt>payload <span class="property-type">array</span></dt>
        <dd>
          Array of <code>{ measurement, tags, fields, timestamp }</code> objects, ready for the
          <b>influxdb batch</b> node of <i>node-red-contrib-influxdb</i>.
        </dd>
      </dl>
    </li>
    <li>
      Health model
      <dl class="message-properties">
        <dt>payload <span class="property-type">object</span></dt>
        <dd>
          Structured reading:
          <code
            >{ chain, polledAt, durationMs, batteries: [{ position, info, power, cells, cellStats
            }], errors }</code
          >. On failure <code>payload</code> is <code>null</code> and <code>msg.error</code> holds
          the reason.
        </dd>
      </dl>
    </li>
  </ol>

  <h3>Measurements</h3>
  <ul>
    <li>
      <code>&lt;prefix&gt;/cell</code> — tags <code>chain</code>, <code>battery</code>,
      <code>cell</code>, <code>barcode</code>; fields <code>voltage</code> V,
      <code>current</code> A, <code>temperature</code> °C, <code>soc</code>,
      <code>coulomb</code> Ah, <code>balancing</code>, <code>soh</code>, state strings.
    </li>
    <li>
      <code>&lt;prefix&gt;/battery</code> — tags <code>chain</code>, <code>battery</code>,
      <code>barcode</code>; module voltage/current/temperatures, <code>cell_min_voltage</code>,
      <code>cell_max_voltage</code>, <code>cell_spread</code>, firmware, and from
      <code>stat N</code>: <code>soh</code>, <code>cycle_count</code>, <code>power_on_hours</code>,
      event counters.
    </li>
    <li>
      <code>&lt;prefix&gt;/stack</code> — tag <code>chain</code>; counts, aggregate voltage/current,
      min/max cell voltage, spread, poll duration.
    </li>
  </ul>

  <h3>Status</h3>
  <p>
    Green <i>ready</i> once the console answers with its <code>pylon&gt;</code> prompt. Blue while
    polling, red with automatic reconnect when the port cannot be opened or disappears.
  </p>

  <h3>Details</h3>
  <p>
    The port is opened at 1200 baud and the Pylontech wake sequence is sent to switch the console to
    115200 baud (uncheck if your console is already fixed at 115200). The default port
    <code>/dev/ttyPYLON</code> is the udev symlink created during the Cerbo setup described in the
    README, which also keeps Venus's <i>serial-starter</i> off the cable.
  </p>
</script>
